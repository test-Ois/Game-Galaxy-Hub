name: Backend Docker deploy
on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Publish the SHA-tagged image to GitHub Container Registry"
        required: true
        type: boolean
        default: false
      deploy_to_server:
        description: "SSH deploy the published image to the configured server (requires secrets)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    name: Build (and optionally publish) Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Registry login
        if: ${{ inputs.publish_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        name: Build image
        with:
          context: .
          file: ./Dockerfile
          push: ${{ inputs.publish_image }}
          tags: |
            ghcr.io/test-ois/game-galaxy-hub:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: Deploy to configured Docker host
    if: ${{ inputs.deploy_to_server && inputs.publish_image }}
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Deploy and health-check with automatic rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HEALTH_PORT: ${{ vars.DEPLOY_HEALTH_PORT || '3000' }}
          IMAGE_TAG: sha-${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST" || { echo "Missing DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing DEPLOY_USER"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing DEPLOY_PATH"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing DEPLOY_SSH_KEY"; exit 1; }
          test -n "$DEPLOY_SSH_KNOWN_HOSTS" || { echo "Missing DEPLOY_SSH_KNOWN_HOSTS"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add <(printf '%s' "$DEPLOY_SSH_KEY")
          ssh -p "$DEPLOY_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' IMAGE_TAG='$IMAGE_TAG' DEPLOY_HEALTH_PORT='$DEPLOY_HEALTH_PORT' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$DEPLOY_PATH"
          PREVIOUS_IMAGE="$(docker compose ps -q app | xargs -r docker inspect --format '{{.Config.Image}}' 2>/dev/null | head -n 1 || true)"
          PREVIOUS_TAG="${PREVIOUS_IMAGE##*:}"
          export IMAGE_TAG
          docker compose pull app
          docker compose up -d --no-build --remove-orphans app
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${DEPLOY_HEALTH_PORT}/health" >/dev/null; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" -eq 1 ]; then echo "Deployment healthy: $IMAGE_TAG"; exit 0; fi
          echo "Health check failed for $IMAGE_TAG."
          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$IMAGE_TAG" ]; then
            echo "Rolling back to $PREVIOUS_TAG."
            export IMAGE_TAG="$PREVIOUS_TAG"
            docker compose up -d --no-build --remove-orphans app
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:${DEPLOY_HEALTH_PORT}/health" >/dev/null; then echo "Rollback is healthy: $PREVIOUS_TAG"; exit 1; fi
              sleep 2
            done
            echo "Rollback health check also failed."
          else
            echo "No previous image tag available for automatic rollback."
          fi
          exit 1
          REMOTE
